[project]
name = "pyPTE"
version = "1.14.3"
description = "Phase Transfer Entropy for directed connectivity analysis, built on NumPy and SciPy"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Patryk Mikulski" }]
requires-python = ">=3.11"
keywords = [
    "PTE",
    "phase transfer entropy",
    "directed connectivity",
    "neuroscience",
    "EEG",
    "MEG",
    "signal processing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

# Deliberately unpinned at the top end: pyPTE is a library and has to resolve
# alongside whatever numpy/scipy the rest of a scientific environment needs.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
mne = ["mne>=1.6", "pandas>=2.0"]

[project.urls]
Homepage = "https://github.com/patrk/pyPTE"
Documentation = "https://patrk.github.io/pyPTE"
Repository = "https://github.com/patrk/pyPTE"
Issues = "https://github.com/patrk/pyPTE/issues"
Changelog = "https://github.com/patrk/pyPTE/releases"

[dependency-groups]
# kept apart from dev so the minimum-versions CI job installs only what the
# test suite needs
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
]
dev = [
    { include-group = "test" },
    "mypy>=1.9",
    "ruff>=0.6",
    "python-semantic-release>=9",
]
docs = [
    "matplotlib>=3.11.1",
    "myst-parser>=5.1.0",
    "numpydoc>=1.11.0",
    "pydata-sphinx-theme>=0.23.0",
    "sphinx>=9.0.4",
    "sphinx-gallery>=0.22.1",
]
examples = [
    "matplotlib>=3.8",
]
# kept out of `examples` on purpose: tvb-data is a ~50 MB download and the
# simulator pulls in ~44 packages, so CI installs it only for the TVB example
tvb = [
    "tvb-library>=2.10",
    "tvb-data>=2.0",
    # tvb-library declares `numba` with no bound, and old numba pulls an
    # llvmlite that cannot build on current Python
    "numba>=0.60",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyPTE"]

[tool.hatch.build.targets.sdist]
include = ["pyPTE", "tests", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# many tests pick small bin counts on purpose; the warning itself is tested in
# test_time_reversal.py with pytest.warns, which sees it regardless
filterwarnings = ["ignore:.*phase bins:RuntimeWarning"]

[tool.coverage.report]
# applies whenever pytest runs with --cov, as CI does
fail_under = 95

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, pyupgrade, bugbear
select = ["F", "E", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["pyPTE"]

[tool.mypy]
# no python_version pin: numpy's bundled stubs use PEP 695 syntax that mypy
# only parses when targeting 3.12+, so this follows the interpreter instead.
# Real 3.11 compatibility is covered by the test matrix, which runs the code.
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# test functions take fixtures and return nothing; annotating each one adds
# noise without catching anything. Their bodies are still type-checked.
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["pyPTE/__init__.py:__version__"]
# the version bump changes pyPTE's own entry in uv.lock, so the lock is updated
# and committed with it; otherwise CI could not install with --locked
build_command = """
    uv lock --upgrade-package pyPTE
    git add uv.lock
    uv build
"""

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.publish]
upload_to_vcs_release = true
