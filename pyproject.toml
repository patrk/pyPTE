[project]
name = "pyPTE"
version = "1.2.0"
description = "Phase Transfer Entropy for directed connectivity analysis, built on NumPy and SciPy"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Patryk Mikulski" }]
requires-python = ">=3.11"
keywords = [
    "PTE",
    "phase transfer entropy",
    "directed connectivity",
    "neuroscience",
    "EEG",
    "MEG",
    "signal processing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

# Deliberately unpinned at the top end: pyPTE is a library and has to resolve
# alongside whatever numpy/scipy the rest of a scientific environment needs.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
mne = ["mne>=1.6", "pandas>=2.0"]

[project.urls]
Homepage = "https://github.com/patrk/pyPTE"
Repository = "https://github.com/patrk/pyPTE"
Issues = "https://github.com/patrk/pyPTE/issues"
Changelog = "https://github.com/patrk/pyPTE/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.9",
    "ruff>=0.6",
    "python-semantic-release>=9",
]
examples = [
    "matplotlib>=3.8",
]
# kept out of `examples` on purpose: tvb-data is a ~50 MB download and the
# simulator pulls in ~44 packages, so CI installs it only for the TVB example
tvb = [
    "tvb-library>=2.10",
    "tvb-data>=2.0",
    # tvb-library declares `numba` with no bound, and old numba pulls an
    # llvmlite that cannot build on current Python
    "numba>=0.60",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyPTE"]

[tool.hatch.build.targets.sdist]
include = ["pyPTE", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, pyupgrade, bugbear
select = ["F", "E", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["pyPTE"]

[tool.mypy]
# no python_version pin: numpy's bundled stubs use PEP 695 syntax that mypy
# only parses when targeting 3.12+, so this follows the interpreter instead.
# Real 3.11 compatibility is covered by the test matrix, which runs the code.
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["pyPTE/__init__.py:__version__"]
build_command = "uv build"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.publish]
upload_to_vcs_release = true
